<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Good Call</title>
  <link rel="stylesheet" href="../shared/styles.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px max(16px, 4vw); }
    main { width: 100%; max-width: 560px; display: grid; gap: 24px; }
    h1 { font-size: 40px; letter-spacing: -0.045em; }
    .lede { color: var(--muted); font-size: 17px; }
    .plan { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; display: grid; gap: 4px; }
    .plan p { font-size: 18px; font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Good call.</h1>
    <p class="lede" id="lede">The urge usually fades within a few minutes once you step away.</p>
    <div class="plan" id="goalBox">
      <span class="label">Back to</span>
      <p id="goal"></p>
    </div>
    <div class="actions">
      <button class="btn" id="newTab" type="button">Open a new tab</button>
      <button class="btn ghost" id="close" type="button">Close this tab</button>
    </div>
    <p class="stat num" id="stat"></p>
  </main>
  <script src="../shared/common.js"></script>
  <script src="left.js"></script>
</body>
</html>
